sonar.projectKey=findxny-os
sonar.projectName=FINDXNY OS

# Code to analyse (host URL + token are passed at scan time, not committed here)
sonar.sources=apps,supabase,packages,tooling
sonar.sourceEncoding=UTF-8

# Tests
sonar.tests=apps
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/e2e/**

# Keep noise out of the scan
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/.claude/**,**/*.min.js,**/*.csv,**/*.svg,**/public/**,**/*.tsbuildinfo,**/playwright-report/**,**/test-results/**,seed/**
